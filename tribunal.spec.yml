name: "Tribunal Kujo-native enterprise hardening"
version: "3.0.0"
goal: "Deliver a secure, bounded, operable, and well-documented Kujo-native adversarial decision engine while preserving all decision-evidence contracts."
priority: "high"
status: "completed"
scope: "Kujo-native CLI, orchestration, persistence, security/resource boundaries, model and context bridges, signed idempotent ingestion, diagnostics, analytics, replay integrity, schemas, operations documentation, Concord, Spec, and Eval."
non_goals:
  - "Direct provider SDK calls from Tribunal"
  - "TypeScript or JavaScript runtime dependencies on main"
  - "Network-required tests"
  - "A web UI"
acceptance_criteria:
  - "Kujo AI SDK resolves provider-neutral model preferences and reports resolution provenance"
  - "Tribunal live routing consumes the SDK resolver instead of selecting the first preferred model"
  - "Every non-integrity run artifact is hashed and replay fails on missing, unexpected, or changed files"
  - "Kujo-native RSA-SHA256 signed runs require a trusted public key before RunLedger or CaseFile ingestion"
  - "RunLedger ingestion records usage, verdict, signed-manifest evidence, and next actions"
  - "CaseFile ingestion preserves the signed Tribunal evidence bundle and an ingestion receipt"
  - "Concord and JSON Schema gates validate CLI, docs, manifests, Spec/Eval, config, records, events, integrity, and signature contracts"
  - "PackWrite context enrichment is opt-in, redacted, deterministic, and does not invoke a model"
  - "All default tests run without secrets or network"
  - "The previous TypeScript implementation remains preserved on the pushed typescript branch"
  - "CLI and configuration reject unknown, duplicate, conflicting, missing-value, and unsafe limit inputs"
  - "Artifacts reject traversal, symbolic links, oversize content, and signed-envelope metadata tampering"
  - "Operators can validate dockets, diagnose the installation, filter machine-readable inventories, and inspect aggregate local statistics"
  - "Production responsibilities and next-session priorities are explicitly documented"
eval_requirements:
  - description: "Every Kujo source module passes runtime checking."
    check_type: "command_succeeds"
    params:
      command: "../kujo/target/release/kujo check tribunal.kujo"
  - description: "Offline Tribunal tests pass."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run tests/tribunal_tests.kujo"
  - description: "Real Kujo CLI integration tests pass."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run tests/cli_integration.kujo"
  - description: "Runtime JSON artifacts satisfy their schemas."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run scripts/schema_gate.kujo"
  - description: "Concord reports no high or critical drift."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run scripts/drift_gate.kujo"
  - description: "Deterministic strategic-five review stays within the local performance budget."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run scripts/benchmark.kujo"
risks:
  - "A self-signed bundle without a separately trusted public key does not establish provenance"
  - "Post-seal writes inside a run directory invalidate the integrity manifest"
review_expectations:
  - "Verify tamper detection with a changed ruling artifact"
  - "Exercise real offline RunLedger, CaseFile, PackWrite, Concord, and Kujo AI SDK paths"
