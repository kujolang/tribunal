name: "Tribunal Kujo-native universal enterprise evidence"
version: "5.0.0"
goal: "Strengthen Tribunal's universal local utility, production safety, auditability, repository clarity, and presentation while preserving all evidence invariants."
priority: "high"
status: "completed"
scope: "Kujo-native CLI, audit workflow, path and identifier safety, exclusive run creation, non-stealing locks, bounded bundle/store imports, secure external outputs, deletion journaling, schemas, regression tests, documentation, release gates, Concord, Spec, and Eval."
non_goals:
  - "Direct provider SDK calls from Tribunal"
  - "TypeScript or JavaScript runtime dependencies on main"
  - "Network-required tests"
  - "An unauthenticated network API or hosted web UI"
acceptance_criteria:
  - "Kujo AI SDK resolves provider-neutral model preferences and reports resolution provenance"
  - "Tribunal live routing consumes the SDK resolver instead of selecting the first preferred model"
  - "Every non-integrity run artifact is hashed and replay fails on missing, unexpected, or changed files"
  - "Kujo-native RSA-SHA256 signed runs require a trusted public key before RunLedger or CaseFile ingestion"
  - "RunLedger ingestion records usage, verdict, signed-manifest evidence, and next actions"
  - "CaseFile ingestion preserves the signed Tribunal evidence bundle and an ingestion receipt"
  - "Concord and JSON Schema gates validate CLI, docs, manifests, Spec/Eval, config, records, events, integrity, and signature contracts"
  - "PackWrite context enrichment is opt-in, redacted, deterministic, and does not invoke a model"
  - "All default tests run without secrets or network"
  - "The previous TypeScript implementation remains preserved on the pushed typescript branch"
  - "CLI and configuration reject unknown, duplicate, conflicting, missing-value, and unsafe limit inputs"
  - "Artifacts reject traversal, symbolic links, oversize content, and signed-envelope metadata tampering"
  - "Operators can validate dockets, diagnose the installation, filter machine-readable inventories, and inspect aggregate local statistics"
  - "Production responsibilities and next-session priorities are explicitly documented"
  - "External signing providers receive opaque key references and federated workload identity but no private material through Tribunal"
  - "Default-deny identity/role policies authorize every mutable and read-sensitive CLI operation"
  - "Trusted-key policy enforces key status, validity windows, rotation metadata, revocation, and allowed targets"
  - "Signed bundles publish and restore through conditional, immutable, versioned local or HTTP artifact-store contracts"
  - "Atomic per-run locks and seal journals recover stale writers and interrupted sealing"
  - "Retention, post-seal legal holds, and policy-driven whole-run deletion preserve external tombstones"
  - "Telemetry and the offline read-only dashboard never mutate sealed run directories"
  - "The Kujo JSON Schema engine validates all emitted contracts and model outputs enforce types, ranges, enums, and extra-field policy"
  - "Cursor pagination and published latency/memory budgets cover large hearings and inventories"
  - "Tag release CI verifies all gates and publishes externally signed evidence bundles"
  - "A single audit command combines integrity, trusted signature, and executable evidence-contract validation"
  - "Run IDs cannot address hidden operational namespaces or contain path/URL metacharacters"
  - "Run creation is exclusive and normal lock acquisition never steals a stale-looking owner"
  - "Bundle and remote-store metadata is validated and bounded before artifacts are copied"
  - "Remote non-loopback adapters require HTTPS and external outputs cannot mutate run storage"
  - "Deletion precommits an external tombstone and legal-hold changes serialize with deletion"
  - "Application logic remains under src with only the thin entrypoint at the repository root"
eval_requirements:
  - description: "Every Kujo source module passes runtime checking."
    check_type: "command_succeeds"
    params:
      command: "../kujo/target/release/kujo check tribunal.kujo"
  - description: "Offline Tribunal tests pass."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run tests/tribunal_tests.kujo"
  - description: "Real Kujo CLI integration tests pass."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run tests/cli_integration.kujo"
  - description: "Enterprise trust, recovery, governance, store, bundle, telemetry, and dashboard tests pass."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run tests/enterprise_tests.kujo"
  - description: "Property boundary corpus passes."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run tests/property_tests.kujo"
  - description: "Runtime JSON artifacts satisfy their schemas."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run scripts/schema_gate.kujo"
  - description: "Concord reports no high or critical drift."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run scripts/drift_gate.kujo"
  - description: "Deterministic strategic-five review stays within the local performance budget."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run scripts/perf_gate.kujo"
  - description: "Large strategic review and cursor inventory stay within published scale budgets."
    check_type: "command_succeeds"
    params:
      command: "TRIBUNAL_HOME=. KUJO_BIN=../kujo/target/release/kujo ../kujo/target/release/kujo run scripts/scale_perf_gate.kujo"
risks:
  - "A self-signed bundle without a separately trusted public key does not establish provenance"
  - "Post-seal writes inside a run directory invalidate the integrity manifest"
  - "HTTP artifact stores and HSM/KMS adapters require deployment-specific authenticated implementations of the published contracts"
  - "Kujo does not yet expose in-process peak RSS, so supervisors must enforce the published memory budget"
review_expectations:
  - "Verify tamper detection with a changed ruling artifact"
  - "Exercise real offline RunLedger, CaseFile, PackWrite, Concord, and Kujo AI SDK paths"
