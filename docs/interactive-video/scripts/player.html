<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribunal | Interactive walkthrough</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #111116; color: #f8f1e6; font: 1rem/1.55 system-ui, sans-serif }
  main { width: min(100% - 2rem, 75rem); margin: 0 auto; padding: 2.25rem 0 }
  h1 { margin: 0 0 1rem; font: normal clamp(2rem, 6vw, 3.7rem)/1 Georgia, serif; letter-spacing: -.04em }
  video { display: block; width: 100%; aspect-ratio: 16/9; background: #19181d; border: 1px solid #71584c; border-radius: .8rem }
  nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .55rem; margin-top: .85rem }
  button, summary { cursor: pointer; color: inherit }
  button { padding: .68rem .65rem; background: #211d23; border: 1px solid #75594d; border-radius: .4rem; font: inherit; font-size: .9rem }
  button:hover, button[aria-current="true"] { background: #50352e; border-color: #ffba95 }
  :focus-visible { outline: 2px solid #ffba95; outline-offset: 3px }
  details { padding: 1rem 0; max-width: 48rem }
  h3 { margin-bottom: .3rem; color: #ffba95 }
  p { margin-top: 0 }
</style>
</head>
<body>
<main>
  <h1>Tribunal walkthrough</h1>
  <video controls playsinline preload="metadata" poster="assets/poster.jpg" aria-label="Tribunal decision review walkthrough">
    <source src="assets/tribunal.mp4" type="video/mp4">
    <track kind="captions" src="assets/captions.vtt" srclang="en" label="English">
  </video>
  <nav aria-label="Video chapters">
    <!-- Chapters -->
  </nav>
  <details><summary>Read the transcript</summary>
    <!-- Transcript -->
  </details>
</main>
<script defer src="player.js"></script>
</body>
</html>
